name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ master, stable, beta, dev, testing, gh-test ]
  pull_request:
    branches: [ master, stable, beta, dev, testing, gh-test ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Install required Android Build Tools
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;29.0.3"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build debug APK
      run: ./gradlew assembleDebug
    - name: Upload experimental APK
      uses: actions/upload-artifact@v4
      with:
        name: Easer-experimental-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Package experimental ZIP
      run: |
        mkdir -p experimental-release
        cp app/build/outputs/apk/debug/app-debug.apk experimental-release/Easer-experimental.apk
        cp README.md experimental-release/README.md || true
        cd experimental-release
        zip -r ../Easer-experimental.zip .
    - name: Upload experimental ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Easer-experimental-zip
        path: Easer-experimental.zip
        if-no-files-found: error

  test:
    needs: [build]
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Generate unit test coverage report
      run: ./gradlew jacocoTestReport
      continue-on-error: true
    - name: Run Android instrumentation tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        script: ./gradlew connectedCheck
      continue-on-error: true
    - name: Codecov
      uses: codecov/codecov-action@v4
      continue-on-error: true
